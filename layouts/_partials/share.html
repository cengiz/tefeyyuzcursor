{{- $url := .Permalink -}}
{{- $title := .Title -}}
<div class="share" aria-label="Paylaş">
  <span class="share-label">Paylaş:</span>
  <a class="share-btn" href="https://twitter.com/intent/tweet?url={{ $url }}&text={{ $title }}" target="_blank" rel="noopener nofollow" aria-label="X'te paylaş">X</a>
  <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u={{ $url }}" target="_blank" rel="noopener nofollow" aria-label="Facebook'ta paylaş">Facebook</a>
  <a class="share-btn" href="https://wa.me/?text={{ $title }}%20{{ $url }}" target="_blank" rel="noopener nofollow" aria-label="WhatsApp'ta paylaş">WhatsApp</a>
  <a class="share-btn" href="https://t.me/share/url?url={{ $url }}&text={{ $title }}" target="_blank" rel="noopener nofollow" aria-label="Telegram'da paylaş">Telegram</a>
  <button class="share-btn" type="button" data-copy="{{ $url }}" aria-label="Bağlantıyı kopyala">Kopyala</button>
</div>
